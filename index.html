<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>love card</title>
	<link rel="stylesheet" href="2.css">
</head>
<body>
<div class="valentines-day-card">
  <input id="open" type="checkbox">
  <label class="open" for="open"></label>
<div class="card-front">
  <div class="note">Apne haato se dabaiye</div>
</div>
  
  <div class="card-inside">
    <div class="inside-content">
      <div class="inside-kicker">A little note for you</div>
      <div class="text-one">I am
        <span>sorryyyyy</span>
      </div>
      <div class="reasons-title">What I love most about you</div>
      <div class="love-reasons">
        <input id="smile-tile" type="checkbox">
        <label class="reason" for="smile-tile">
          <span class="reason-label">Your smile</span>
          <span class="reason-emoji" aria-hidden="true">😊</span>
        </label>
        <input id="magic-tile" type="checkbox">
        <label class="reason" for="magic-tile">
          <span class="reason-label">Your magic</span>
          <span class="reason-emoji" aria-hidden="true">✨</span>
        </label>
        <input id="always-tile" type="checkbox">
        <label class="reason" for="always-tile">
          <span class="reason-label">Us, always</span>
          <span class="reason-emoji" aria-hidden="true">💞</span>
        </label>
      </div>
      <input id="surprise" type="checkbox">
      <label class="surprise-button" for="surprise">Tap for a secret</label>
      <div class="secret-message">You are my favorite person, in every universe.</div>
      <input id="forgive" type="checkbox">
      <label class="forgive-button" for="forgive">I forgive you</label>
      <div class="forgive-message">Yay! Come here, silly.</div>
    </div>
    <div class="heart"></div>
    <div class="smile"></div>
    <div class="eyes"></div>
</div>
</div>
</body>
</html>
